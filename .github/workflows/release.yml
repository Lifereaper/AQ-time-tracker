name: Build and Auto-Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      shell: powershell
      run: |
        $sln = Get-ChildItem -Filter *.sln -Recurse | Select-Object -First 1
        nuget restore $sln.FullName

    - name: Build WPF Project
      shell: powershell
      run: |
        $sln = Get-ChildItem -Filter *.sln -Recurse | Select-Object -First 1
        msbuild $sln.FullName /p:Configuration=Release /p:Platform="Any CPU"

    - name: Zip Built Binaries
      shell: powershell
      run: |
        $releaseDir = Get-ChildItem -Path . -Recurse -Filter "Release" -Directory | Where-Object { $_.FullName -like "*\bin\Release" } | Select-Object -First 1
        Compress-Archive -Path "$($releaseDir.FullName)\*" -DestinationPath NGTecoClockDashboard.zip

    - name: Update update.xml
      shell: powershell
      run: |
        $rawTag = "${{ github.ref_name }}"
        $version = $rawTag.TrimStart('v')
        $lines = @(
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<item>',
            "    <version>$version</version>",
            '    <url>https://github.com/Lifereaper/AQ-time-tracker/releases/latest/download/NGTecoClockDashboard.zip</url>',
            '    <changelog>https://github.com/Lifereaper/AQ-time-tracker/releases</changelog>',
            '    <mandatory>false</mandatory>',
            '</item>'
        )
        Set-Content -Path update.xml -Value $lines
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add update.xml
        git commit -m "Auto-update update.xml for release $rawTag" || exit 0
        git push origin HEAD:main

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: NGTecoClockDashboard.zip
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
